name: Docker Build and Push

on:
  push:
    tags:
      - 'v*.*.*'
      - 'dev'

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

  docker:
    needs: release
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      matrix:
        arch:
          - runner: ubuntu-24.04
            platform: amd64
          - runner: ubuntu-24.04-arm
            platform: arm64
        image:
          - image-name: ion-indexer-classifier
            context: .
            dockerfile: Dockerfile
            target: classifier
          - image-name: ion-indexer-api
            context: .
            dockerfile: Dockerfile
            target: index-api
          - image-name: ion-indexer-worker
            context: .
            dockerfile: Dockerfile
            target: index-worker
          - image-name: ion-indexer-metadata-fetcher
            context: .
            dockerfile: Dockerfile
            target: metadata-fetcher
          - image-name: ion-indexer-emulate-api
            context: .
            dockerfile: Dockerfile
            target: emulate-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.arch.platform }}
          push: true
          target: ${{ matrix.image.target }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image.image-name }}:${{ needs.release.outputs.version }}-${{ matrix.arch.platform }}

  manifest:
    needs: [docker, release]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image:
          - ion-indexer-classifier
          - ion-indexer-api
          - ion-indexer-worker
          - ion-indexer-metadata-fetcher
          - ion-indexer-emulate-api
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker manifest create ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ needs.release.outputs.version }} \
            --amend ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ needs.release.outputs.version }}-amd64 \
            --amend ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ needs.release.outputs.version }}-arm64
          docker manifest push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ needs.release.outputs.version }}
