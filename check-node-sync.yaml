---
- name: Check ION validator time drift
  hosts: "{{ stack_name }}__ion_nodes"
  gather_facts: no

  tasks:
    - name: Calculate time drift between local node and masterchain (seconds)
      become: yes
      shell: |
        set -o pipefail

        height=$(
          /usr/bin/ion/validator-engine-console/validator-engine-console \
            --address 127.0.0.1:$(jq -r '.control[0].port' /var/ion-work/db/config.json) \
            --key /var/ion-work/keys/client \
            --pub /var/ion-work/keys/server.pub \
            -c getstats
        )

        unixtime=$(echo "$height" | awk '{ for (i=1; i<NF; i++) if ($i=="unixtime") { print $(i+1); exit } }')
        mastertime=$(echo "$height" | awk '{ for (i=1; i<NF; i++) if ($i=="masterchainblocktime") { print $(i+1); exit } }')

        echo $((unixtime - mastertime))
      args:
        executable: /bin/bash
      register: sync_delta
      changed_when: false

    - name: Fail if sync_delta above threshold
      debug:
        msg: "Node sync is {{ sync_delta.stdout | trim }}s (threshold {{ threshold | default(60) }}s)"
      failed_when: (sync_delta.stdout | trim | int) > (threshold | int)
      changed_when: false
